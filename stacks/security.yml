AWSTemplateFormatVersion: '2010-09-09'
Description: Stack de Security Groups - Stefanny

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID de la VPC por defecto

Resources:
  SGPublicEC2:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: SG-EC2-Stefanny
      GroupDescription: Security Group para instancia EC2 publica
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SG-EC2-Stefanny

  SGALB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: SG-ALB-Stefanny
      GroupDescription: Security Group para el Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SG-ALB-Stefanny

Outputs:
  SGPublicEC2Id:
    Description: ID del Security Group EC2
    Value: !Ref SGPublicEC2
    Export:
      Name: SecurityGroups-Stefanny-EC2

  SGALBId:
    Description: ID del Security Group ALB
    Value: !Ref SGALB
    Export:
      Name: SecurityGroups-Stefanny-ALB