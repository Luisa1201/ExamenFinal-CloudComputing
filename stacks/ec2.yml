AWSTemplateFormatVersion: '2010-09-09'
Description: Stack EC2 Estatica con Elastic IP - Stefanny

Parameters:
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet publica donde se desplegara la EC2

Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0c02fb55956c7d316
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !ImportValue SecurityGroups-Stefanny-EC2
      Tags:
        - Key: Name
          Value: EC2-Stefanny
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Hola desde EC2 - Stefanny y Luisa</h1>" > /var/www/html/index.html

  MyElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref MyEC2Instance
      Tags:
        - Key: Name
          Value: EIP-Stefanny

Outputs:
  InstanceId:
    Description: ID de la instancia EC2
    Value: !Ref MyEC2Instance
    Export:
      Name: EC2-Stefanny-InstanceId

  PublicIP:
    Description: Direccion IP publica estatica
    Value: !Ref MyElasticIP
    Export:
      Name: EC2-Stefanny-EIP