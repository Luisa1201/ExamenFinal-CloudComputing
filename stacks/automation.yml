AWSTemplateFormatVersion: '2010-09-09'
Description: Stack Automatizacion Scheduled Actions y Version 2 LT - Luisa

Resources:
  LTVersion2:
    Type: AWS::EC2::LaunchTemplateVersion
    Properties:
      LaunchTemplateId: !ImportValue ALB-ASG-Luisa-LT
      VersionDescription: Version 2 - Actualizacion de aplicacion
      LaunchTemplateData:
        InstanceType: t3.micro
        ImageId: ami-0c02fb55956c7d316
        SecurityGroupIds:
          - !ImportValue SecurityGroups-Stefanny-EC2
        UserData:
          Fn::Base64: |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd
            echo "<h1>App ASG - Luisa - Version 2</h1>" > /var/www/html/index.html

  ScheduledActionScaleUp1:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue ALB-ASG-Luisa-ASG
      ScheduledActionName: ScaleUp1-Luisa
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 3
      Recurrence: "0 8 * * 1-5"

  ScheduledActionScaleUp2:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue ALB-ASG-Luisa-ASG
      ScheduledActionName: ScaleUp2-Luisa
      MinSize: 3
      MaxSize: 4
      DesiredCapacity: 4
      Recurrence: "0 12 * * 1-5"

  ScheduledActionScaleDown1:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue ALB-ASG-Luisa-ASG
      ScheduledActionName: ScaleDown1-Luisa
      MinSize: 1
      MaxSize: 4
      DesiredCapacity: 2
      Recurrence: "0 18 * * 1-5"

  ScheduledActionScaleDown2:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue ALB-ASG-Luisa-ASG
      ScheduledActionName: ScaleDown2-Luisa
      MinSize: 1
      MaxSize: 4
      DesiredCapacity: 1
      Recurrence: "0 22 * * 1-5"

Outputs:
  ScaleUp1:
    Description: Accion programada Scale Up 1
    Value: !Ref ScheduledActionScaleUp1
  ScaleUp2:
    Description: Accion programada Scale Up 2
    Value: !Ref ScheduledActionScaleUp2
  ScaleDown1:
    Description: Accion programada Scale Down 1
    Value: !Ref ScheduledActionScaleDown1
  ScaleDown2:
    Description: Accion programada Scale Down 2
    Value: !Ref ScheduledActionScaleDown2
